<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JEE Chapter Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0f1a;--card:#111827;--fg:#e2e8f0;--mut:#94a3b8;--line:rgba(255,255,255,.1);--ac:#6366f1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
main{max-width:1500px;margin:0 auto;padding:16px 12px 64px;display:grid;gap:12px}
h1{margin:0;font-size:26px}h2,h3{margin:0}.sub{color:var(--mut);font-size:14px;margin:4px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{font:inherit;color:inherit}
button,select{background:#0f172a;border:1px solid var(--line);border-radius:10px;min-height:42px;padding:0 12px;cursor:pointer;font-size:13px}
button:hover{background:#1e293b}button:disabled{opacity:.4;cursor:default}
.panel{background:rgba(17,24,39,.7);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.bar{display:flex;height:8px;border-radius:99px;background:#1e293b;overflow:hidden}.bar i{display:block;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{background:rgba(255,255,255,.05);border-radius:10px;padding:8px;text-align:center;font-size:11px;color:var(--mut)}.stats b{display:block;font-size:20px;color:var(--fg)}
.subs{display:grid;gap:8px;margin-top:10px}.subs small{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-bottom:4px}
.note{font-size:11px;color:#64748b;margin:6px 0 0}
#tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(11,15,26,.92);padding:8px;border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px)}
#tabs button{border:0;background:transparent;color:#cbd5e1;font-weight:600}#tabs button.on{background:var(--ac);color:#fff}
.search{flex:1;min-width:160px;height:44px;background:#0f172a;border:1px solid var(--line);border-radius:12px;padding:0 12px;outline:0}.search:focus{border-color:#818cf8}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.pills button{border-radius:99px;min-height:34px;white-space:nowrap}.pills button.on{border-color:#818cf8;background:rgba(99,102,241,.25)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(6,1fr)}.subs{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}
.col{border:1px solid var(--line);border-radius:16px;padding:10px;min-height:140px;display:flex;flex-direction:column;gap:8px;transition:.15s}
.col h3{font-size:14px;display:flex;align-items:center;gap:6px}.col h3 em{font-style:normal;color:var(--mut);font-weight:400}
.col[data-cat=easy]{background:rgba(52,211,153,.05);border-color:rgba(52,211,153,.3)}.col[data-cat=revise]{background:rgba(251,191,36,.05);border-color:rgba(251,191,36,.3)}.col[data-cat=hard]{background:rgba(251,113,133,.05);border-color:rgba(251,113,133,.3)}.col[data-cat=pool]{background:rgba(15,23,42,.6)}
.col.over{outline:2px solid #818cf8;background:rgba(99,102,241,.14)}.col[data-cat=easy].over{outline-color:#34d399}.col[data-cat=revise].over{outline-color:#fbbf24}.col[data-cat=hard].over{outline-color:#fb7185}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px 8px;text-align:center;font-size:12px;color:#64748b}
.chip{display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:#1e293b;font-size:14px;line-height:1.3;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 2px 6px rgba(0,0,0,.3);animation:pop .18s ease-out}
.chip:hover{border-color:rgba(255,255,255,.3)}.chip.src{opacity:.3}.chip span.n{flex:1;min-width:0;overflow-wrap:anywhere}.tag{font-size:10px;color:var(--mut);background:rgba(255,255,255,.06);border-radius:5px;padding:2px 5px}
.ghost{position:fixed;z-index:100;pointer-events:none;width:240px;transform:scale(1.04);box-shadow:0 12px 30px rgba(0,0,0,.6)}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.lrow{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.05)}.lrow .t{flex:1;min-width:0;text-align:left;border:0;background:none;min-height:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead{width:100%;display:flex;justify-content:space-between;text-align:left;font-weight:600;background:rgba(255,255,255,.05);margin-bottom:8px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.ov{align-items:center;padding:16px}}
.dlg{background:#0f172a;border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;animation:pop .18s}
@media(min-width:640px){.dlg{border-radius:18px}}
.dlg .hd{display:flex;justify-content:space-between;gap:10px;padding:14px;border-bottom:1px solid var(--line)}.dlg .bd{padding:14px;overflow-y:auto;display:grid;gap:14px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cats button{text-align:left;min-height:46px}.cats button.on{background:rgba(255,255,255,.12);outline:1px solid rgba(255,255,255,.4)}
textarea{width:100%;background:#1e293b;border:1px solid var(--line);border-radius:10px;padding:8px;resize:none;outline:0}
ul.tp{margin:0;padding-left:18px;font-size:13px;color:#cbd5e1;display:grid;gap:5px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:6px}
footer{font-size:12px;color:var(--mut)}footer a{color:#a5b4fc}
.danger{border-color:rgba(251,113,133,.4);color:#fda4af}
</style></head><body><main>
<nav id="tabs"></nav>
<div class="row"><input class="search" id="q" placeholder="Search chapters…" aria-label="Search"><button id="vb" aria-label="Toggle view"></button></div>
<div class="pills" id="pills"></div>
<div class="row" id="acts"></div>
<div class="row" id="io"></div>
<div id="board"></div>
</main><div id="modal"></div>
<script>
const D={"examYear":2026,"version":"jee-main-2026-chapters-v2","paper":"Paper 1 (B.E./B.Tech)","verified":true,"url":"https://jeemain.nta.nic.in/document/syllabus-2026/","urlLabel":"NTA JEE Main 2026 official syllabus","subjects":[{"id":"physics","label":"Physics","short":"Phy"},{"id":"chemistry","label":"Chemistry","short":"Chem"},{"id":"maths","label":"Mathematics","short":"Math"}],"units":{"physics":[{"id":"p01","name":"Units and Measurements","topics":[]},{"id":"p02","name":"Motion in a Straight Line","topics":[]},{"id":"p03","name":"Motion in a Plane","topics":[]},{"id":"p04","name":"Laws of Motion","topics":[]},{"id":"p05","name":"Work, Energy and Power","topics":[]},{"id":"p06","name":"System of Particles and Centre of Mass","topics":[]},{"id":"p07","name":"Rotational Motion","topics":[]},{"id":"p08","name":"Gravitation","topics":[]},{"id":"p09","name":"Mechanical Properties of Solids","topics":[]},{"id":"p10","name":"Mechanical Properties of Fluids","topics":[]},{"id":"p11","name":"Thermal Properties of Matter","topics":[]},{"id":"p12","name":"Thermodynamics","topics":[]},{"id":"p13","name":"Kinetic Theory of Gases","topics":[]},{"id":"p14","name":"Oscillations","topics":[]},{"id":"p15","name":"Waves","topics":[]},{"id":"p16","name":"Electric Charges and Fields","topics":[]},{"id":"p17","name":"Electrostatic Potential and Capacitance","topics":[]},{"id":"p18","name":"Current Electricity","topics":[]},{"id":"p19","name":"Moving Charges and Magnetism","topics":[]},{"id":"p20","name":"Magnetism and Matter","topics":[]},{"id":"p21","name":"Electromagnetic Induction","topics":[]},{"id":"p22","name":"Alternating Current","topics":[]},{"id":"p23","name":"Electromagnetic Waves","topics":[]},{"id":"p24","name":"Ray Optics and Optical Instruments","topics":[]},{"id":"p25","name":"Wave Optics","topics":[]},{"id":"p26","name":"Dual Nature of Radiation and Matter","topics":[]},{"id":"p27","name":"Atoms","topics":[]},{"id":"p28","name":"Nuclei","topics":[]},{"id":"p29","name":"Semiconductor Electronics","topics":[]},{"id":"p30","name":"Experimental Skills","topics":[]}],"chemistry":[{"id":"c01","name":"Some Basic Concepts in Chemistry","topics":[]},{"id":"c02","name":"Atomic Structure","topics":[]},{"id":"c03","name":"Chemical Bonding and Molecular Structure","topics":[]},{"id":"c04","name":"Chemical Thermodynamics","topics":[]},{"id":"c05","name":"Solutions","topics":[]},{"id":"c06","name":"Equilibrium","topics":[]},{"id":"c07","name":"Redox Reactions","topics":[]},{"id":"c08","name":"Electrochemistry","topics":[]},{"id":"c09","name":"Chemical Kinetics","topics":[]},{"id":"c10","name":"Classification of Elements and Periodicity in Properties","topics":[]},{"id":"c11","name":"p-Block Elements","topics":[]},{"id":"c12","name":"d- and f-Block Elements","topics":[]},{"id":"c13","name":"Coordination Compounds","topics":[]},{"id":"c14","name":"Purification and Characterisation of Organic Compounds","topics":[]},{"id":"c15","name":"Some Basic Principles of Organic Chemistry","topics":[]},{"id":"c16","name":"Hydrocarbons","topics":[]},{"id":"c17","name":"Organic Compounds Containing Halogens","topics":[]},{"id":"c18","name":"Alcohols, Phenols and Ethers","topics":[]},{"id":"c19","name":"Aldehydes, Ketones and Carboxylic Acids","topics":[]},{"id":"c20","name":"Organic Compounds Containing Nitrogen","topics":[]},{"id":"c21","name":"Biomolecules","topics":[]},{"id":"c22","name":"Principles Related to Practical Chemistry","topics":[]}],"maths":[{"id":"m01","name":"Sets, Relations and Functions","topics":[]},{"id":"m02","name":"Complex Numbers","topics":[]},{"id":"m03","name":"Quadratic Equations","topics":[]},{"id":"m04","name":"Matrices","topics":[]},{"id":"m05","name":"Determinants","topics":[]},{"id":"m06","name":"Permutations and Combinations","topics":[]},{"id":"m07","name":"Binomial Theorem","topics":[]},{"id":"m08","name":"Sequences and Series","topics":[]},{"id":"m09","name":"Trigonometry","topics":[]},{"id":"m10","name":"Limits","topics":[]},{"id":"m11","name":"Continuity and Differentiability","topics":[]},{"id":"m12","name":"Applications of Derivatives","topics":[]},{"id":"m13","name":"Indefinite Integration","topics":[]},{"id":"m14","name":"Definite Integration","topics":[]},{"id":"m15","name":"Area Under Curves","topics":[]},{"id":"m16","name":"Differential Equations","topics":[]},{"id":"m17","name":"Straight Lines","topics":[]},{"id":"m18","name":"Circles","topics":[]},{"id":"m19","name":"Conic Sections","topics":[]},{"id":"m20","name":"Three-Dimensional Geometry","topics":[]},{"id":"m21","name":"Vector Algebra","topics":[]},{"id":"m22","name":"Statistics","topics":[]},{"id":"m23","name":"Probability","topics":[]}]}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C={pool:['Uncategorised','#94a3b8','⚪'],easy:['Easy','#34d399','🟢'],revise:['Need Revision','#fbbf24','🟡'],hard:['Hard','#fb7185','🔴']},IDS=Object.keys(C),KEY='jee-tracker:'+D.version;
const SUB=D.subjects;let S={e:{physics:{},chemistry:{},maths:{}},at:null,view:'board'},hist=[],tab='physics',q='',flt='all',bulk='revise',coll={},lastDrag=0;
try{const p=JSON.parse(localStorage.getItem(KEY)||'null');if(p&&p.e){for(const s of SUB.map(x=>x.id))for(const[k,v]of Object.entries(p.e[s]||{}))if(v&&IDS.includes(v.cat))S.e[s][k]={cat:v.cat,note:typeof v.note==='string'?v.note.slice(0,500):undefined};S.at=+p.at||null;S.view=p.view==='list'?'list':'board'}}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const cat=(s,id)=>(S.e[s][id]||{}).cat||'pool',units=s=>D.units[s],lab=s=>SUB.find(x=>x.id===s).label;
function stat(s){const r={total:units(s).length,pool:0,easy:0,revise:0,hard:0};units(s).forEach(u=>r[cat(s,u.id)]++);r.done=r.easy+r.revise+r.hard;r.pct=Math.round(r.done/r.total*100);return r}
function commit(fn,track=true){if(track){hist.push(JSON.stringify(S.e));if(hist.length>30)hist.shift()}fn();S.at=Date.now();persist();render()}
const move=(s,id,c)=>{if(cat(s,id)===c)return;commit(()=>{S.e[s][id]={...S.e[s][id],cat:c}})};
const match=u=>!q||u.name.toLowerCase().includes(q);
function render(){
 const per=Object.fromEntries(SUB.map(s=>[s.id,stat(s.id)]));
 $('#tabs').innerHTML=[...SUB,{id:'all',label:'All',short:'All'}].map(s=>`<button data-tab="${s.id}" class="${tab===s.id?'on':''}">${s.id==='all'?'All':`<span class="lg">${s.label}</span>`}${s.id==='all'?'':` <small>${per[s.id].pct}%</small>`}</button>`).join('');
 $('#pills').innerHTML=['all',...IDS].map(f=>`<button data-f="${f}" class="${flt===f?'on':''}">${f==='all'?'All':f==='pool'?'Uncategorised':f==='revise'?'Need revision only':f==='hard'?'Hard only':C[f][0]}</button>`).join('');
 $('#vb').textContent=S.view==='board'?'☰ List view':'▦ Board view';
 const one=tab!=='all'?tab:null;
 $('#acts').innerHTML=`<button id="undo" ${hist.length?'':'disabled'}>↩ Undo</button>`+(one?`<select id="bc">${['easy','revise','hard'].map(c=>`<option value="${c}" ${bulk===c?'selected':''}>${C[c][0]}</option>`).join('')}</select><button id="bm" ${per[one].pool?'':'disabled'}>Move all uncategorised</button><button id="rs">Reset ${lab(one)}</button>`:'')+`<button id="ra" class="danger">Reset all</button>`;
 const shown=SUB.filter(s=>tab==='all'||s.id===tab);
 $('#board').innerHTML=shown.map(s=>{const c=tab==='all'&&coll[s.id];return `<section style="margin-bottom:18px">${tab==='all'?`<button class="shead" data-coll="${s.id}">${s.label} <small>${per[s.id].done}/${per[s.id].total} sorted ${c?'▸':'▾'}</small></button>`:`<h2 style="margin-bottom:8px">${s.label} <small style="color:var(--mut);font-weight:400">· ${units(s.id).length} units</small></h2>`}${c?'':boardHtml(s.id)}</section>`}).join('');
}
function boardHtml(s){
 const vis=units(s).filter(u=>match(u)&&(flt==='all'||cat(s,u.id)===flt));
 if(S.view==='list')return `<div class="panel" style="padding:0">${vis.length?vis.map(u=>`<div class="lrow"><span class="dot" style="background:${C[cat(s,u.id)][1]}"></span><button class="t" data-open="${s}:${u.id}">${esc(u.name)}</button><select data-sel="${s}:${u.id}" aria-label="Category for ${esc(u.name)}">${IDS.map(c=>`<option value="${c}" ${cat(s,u.id)===c?'selected':''}>${C[c][0]}</option>`).join('')}</select></div>`).join(''):'<p class="empty">No chapters match.</p>'}</div>`;
 return `<div class="grid">${IDS.map(c=>{const tot=units(s).filter(u=>cat(s,u.id)===c).length,items=vis.filter(u=>cat(s,u.id)===c);return `<div class="col" data-drop="${s}:${c}" data-cat="${c}"><h3 style="color:${C[c][1]}"><span class="dot" style="background:${C[c][1]}"></span>${C[c][0]} <em>(${tot})</em>${items.length!==tot?`<em style="margin-left:auto;font-size:11px">${items.length} shown</em>`:''}</h3>${items.length?items.map(u=>chip(s,u)).join(''):'<div class="empty">Drop chapters here</div>'}</div>`}).join('')}</div>`}
const chip=(s,u)=>`<div class="chip" data-s="${s}" data-id="${u.id}" role="button" tabindex="0"><span class="dot" style="background:${C[cat(s,u.id)][1]}"></span><span class="n">${esc(u.name)}</span>${u.group?`<span class="tag">${u.group}</span>`:''}${(S.e[s][u.id]||{}).note?'<span title="Has note">📝</span>':''}</div>`;
function confirmBox(title,msg,label,fn,danger=true){const m=$('#modal');m.innerHTML=`<div class="ov" id="ov"><div class="dlg" role="alertdialog" style="padding:18px;gap:10px"><h2>${title}</h2><p style="color:#cbd5e1;font-size:14px;margin:0">${msg}</p><div class="row" style="justify-content:flex-end"><button id="cn">Cancel</button><button id="ok" style="background:${danger?'#e11d48':'#4f46e5'};border:0;color:#fff">${label}</button></div></div></div>`;$('#cn').onclick=()=>m.innerHTML='';$('#ov').onclick=e=>{if(e.target.id==='ov')m.innerHTML=''};$('#ok').onclick=()=>{m.innerHTML='';fn()}}
function openChapter(s,id){const u=units(s).find(x=>x.id===id),m=$('#modal');
 const paint=()=>{m.querySelectorAll('[data-pick]').forEach(b=>b.classList.toggle('on',b.dataset.pick===cat(s,id)))};
 m.innerHTML=`<div class="ov" id="ov"><div class="dlg" role="dialog"><div class="hd"><div><small style="color:var(--mut)">${lab(s)}${u.group?' · '+u.group+' Chemistry':''} · Chapter</small><h2 style="font-size:18px;margin-top:2px">${esc(u.name)}</h2></div><button id="x" aria-label="Close">✕</button></div><div class="bd"><div><div class="lbl">Set category</div><div class="cats">${IDS.map(c=>`<button data-pick="${c}">${C[c][2]} ${C[c][0]}</button>`).join('')}</div></div><div><div class="lbl">Notes</div><textarea id="nt" rows="2" maxlength="500" placeholder="e.g. Revise formulas, practise PYQs">${esc((S.e[s][id]||{}).note||'')}</textarea></div></div></div></div>`;
 paint();const close=()=>{m.innerHTML='';render()};$('#x').onclick=close;$('#ov').onclick=e=>{if(e.target.id==='ov')close()};
 m.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{move(s,id,b.dataset.pick);openChapter(s,id)});
 $('#nt').oninput=e=>{S.e[s][id]={cat:cat(s,id),note:e.target.value};if(!e.target.value)delete S.e[s][id].note;S.at=Date.now();persist()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML){$('#modal').innerHTML='';render()}if(e.key==='Enter'&&e.target.classList?.contains('chip'))openChapter(e.target.dataset.s,e.target.dataset.id)});
document.addEventListener('click',e=>{const t=e.target,g=a=>t.closest('['+a+']');
 if(g('data-tab')){tab=g('data-tab').dataset.tab;return render()}
 if(g('data-f')){flt=g('data-f').dataset.f;return render()}
 if(g('data-coll')){const k=g('data-coll').dataset.coll;coll[k]=!coll[k];return render()}
 if(g('data-open')){const[s,id]=g('data-open').dataset.open.split(':');return openChapter(s,id)}
 const ch=t.closest('.chip');if(ch&&Date.now()-lastDrag>300)return openChapter(ch.dataset.s,ch.dataset.id);
 if(t.id==='vb'){S.view=S.view==='board'?'list':'board';persist();render()}
 if(t.id==='undo'&&hist.length){S.e=JSON.parse(hist.pop());S.at=Date.now();persist();render()}
 if(t.id==='bm')confirmBox('Move all uncategorised?',`Every uncategorised ${lab(tab)} chapter will move to “${C[bulk][0]}”. You can undo this.`,'Move all',()=>commit(()=>{units(tab).forEach(u=>{if(cat(tab,u.id)==='pool')S.e[tab][u.id]={...S.e[tab][u.id],cat:bulk}})}),false);
 if(t.id==='rs')confirmBox('Reset '+lab(tab)+'?','All placements and notes for this subject will be cleared.','Reset subject',()=>commit(()=>{S.e[tab]={}}));
 if(t.id==='ra')confirmBox('Reset all progress?','All placements and notes for every subject will be cleared.','Reset everything',()=>commit(()=>{S.e={physics:{},chemistry:{},maths:{}}}));
});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='bc')bulk=t.value;if(t.dataset.sel){const[s,id]=t.dataset.sel.split(':');move(s,id,t.value)}});
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();$('#board').innerHTML&&render()};
/* drag & drop: pointer events (mouse + touch long-press) */
let dr=null;document.addEventListener('touchmove',e=>{if(dr&&dr.on)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.chip'))e.preventDefault()});
function startDrag(){if(!dr||dr.on)return;dr.on=true;const g=dr.el.cloneNode(true);g.className='chip ghost';document.body.appendChild(g);dr.g=g;dr.el.classList.add('src');if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}}
function stopDrag(){if(!dr)return;clearTimeout(dr.t);dr.g&&dr.g.remove();dr.el.classList.remove('src');document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));dr=null}
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.chip');if(!el||el.classList.contains('ghost')||(e.pointerType==='mouse'&&e.button!==0))return;dr={el,s:el.dataset.s,id:el.dataset.id,x:e.clientX,y:e.clientY,on:false,touch:e.pointerType==='touch'};if(dr.touch)dr.t=setTimeout(startDrag,180)});
document.addEventListener('pointermove',e=>{if(!dr)return;if(!dr.on){const d=Math.hypot(e.clientX-dr.x,e.clientY-dr.y);if(dr.touch){if(d>8){clearTimeout(dr.t);dr=null}return}if(d<6)return;startDrag()}
 dr.g.style.left=e.clientX-120+'px';dr.g.style.top=e.clientY-24+'px';document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
 const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]');if(t&&t.dataset.drop.startsWith(dr.s+':'))t.classList.add('over')});
document.addEventListener('pointerup',e=>{if(!dr)return;if(dr.on){lastDrag=Date.now();const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]'),[s,c]=t?t.dataset.drop.split(':'):[];const{s:ds,id}=dr;stopDrag();if(t&&s===ds)move(s,id,c);else render()}else stopDrag()});
document.addEventListener('pointercancel',()=>{if(dr&&dr.on){lastDrag=Date.now();stopDrag();render()}else stopDrag()});
/* export / import */
$('#io').innerHTML=`<button id="ex">⬇ Export Progress</button><button id="im">⬆ Import Progress</button><input type="file" id="fi" accept="application/json,.json" hidden><span id="msg" role="status" style="font-size:12px"></span>`;
const say=(t,ok)=>{const m=$('#msg');m.textContent=t;m.style.color=ok?'#6ee7b7':'#fda4af';setTimeout(()=>m.textContent='',6000)};
$('#ex').onclick=async()=>{const rows=SUB.flatMap(s=>units(s.id).map(u=>({subject:s.label,chapter:u.name,status:cat(s.id,u.id),note:(S.e[s.id][u.id]||{}).note||''})));
 const blob=new Blob([JSON.stringify({app:'jee-chapter-tracker',syllabusVersion:D.version,examYear:D.examYear,exportedAt:new Date().toISOString(),entries:S.e,readable:rows},null,2)],{type:'application/json'});
 try{const d=window.claude&&await claude.use('downloads');if(!d)return say('Export is not available in this view.',false);await d.save({filename:'jee-progress-'+new Date().toISOString().slice(0,10)+'.json',data:blob})}catch(e){if(!e||e.code!=='declined')say('Export failed.',false)}};
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(!p||p.app!=='jee-chapter-tracker'||!p.entries||typeof p.entries!=='object')throw 0;const n={physics:{},chemistry:{},maths:{}};let k=0,u=0;for(const s of SUB.map(x=>x.id)){const ids=new Set(units(s).map(x=>x.id));for(const[id,v]of Object.entries(p.entries[s]||{})){if(!v||!IDS.includes(v.cat))continue;n[s][id]={cat:v.cat,note:typeof v.note==='string'?v.note.slice(0,500):undefined};ids.has(id)?k++:u++}}
 commit(()=>{S.e=n});say(`Imported ${k} chapters${u?` (${u} not in this syllabus kept)`:''}. Undo is available.`,true)}catch(x){say('Not a valid JEE Chapter Tracker export.',false)}e.target.value=''};
render();
